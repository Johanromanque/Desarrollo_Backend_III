# Activar con --spring.profiles.active=oracle.
# Ningun secreto ni ruta personal se guarda en el proyecto.
spring.datasource.url=${ORACLE_JDBC_URL}
spring.datasource.username=${ORACLE_DB_USERNAME}
spring.datasource.password=${ORACLE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=${ORACLE_POOL_SIZE:6}
spring.datasource.hikari.connection-init-sql=ALTER SESSION DISABLE PARALLEL DML

spring.batch.jdbc.platform=oracle
spring.batch.jdbc.initialize-schema=never
spring.sql.init.mode=never
