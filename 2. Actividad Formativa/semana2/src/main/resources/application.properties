spring.application.name=formativa1

# Configuracion comun y no sensible.
app.batch.chunk-size=5
app.batch.core-pool-size=3
app.batch.max-pool-size=3
app.batch.queue-capacity=15

# Evidencia local. El archivo se ignora y nunca debe contener secretos.
logging.file.name=${APP_LOG_FILE:logs/formativa1.log}

# El Job se elige al ejecutar con --spring.batch.job.name=<nombre>.
spring.batch.jdbc.isolation-level-for-create=READ_COMMITTED
