spring.datasource.url=jdbc:h2:mem:formativa1;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=6

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.platform=h2
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/test/schema-h2.sql

logging.file.name=
logging.level.cl.duoc.formativa1=INFO
